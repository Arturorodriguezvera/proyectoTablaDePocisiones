<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreras de dragsters</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    asfalto: '#10233B', hormigon: '#E6E8E5', bandera: '#C8242B', placa: '#F5C400'
  } } } };
</script>
<style type="text/tailwindcss">
  @layer components {
    .campo { @apply mt-1 block w-full rounded-md border-2 border-asfalto/30 bg-white px-3 py-2 text-lg text-asfalto focus:border-asfalto focus:outline-none focus:ring-4 focus:ring-placa disabled:bg-hormigon disabled:text-asfalto/40; }
    .boton { @apply rounded-md bg-asfalto px-5 py-2 text-lg font-bold text-white focus:outline-none focus:ring-4 focus:ring-placa disabled:cursor-not-allowed disabled:opacity-40; }
    .placa { @apply flex h-12 w-16 shrink-0 items-center justify-center rounded-md border-2 border-asfalto bg-placa text-3xl text-asfalto; font-family: Impact, 'Arial Narrow Bold', sans-serif; }
  }
</style>
</head>
<body class="min-h-screen bg-hormigon text-asfalto">
<header class="bg-asfalto text-white">
  <div class="mx-auto max-w-3xl px-4 py-6">
    <h1 class="text-4xl font-black italic tracking-tight" style="font-family: Impact, 'Arial Narrow Bold', sans-serif">Carreras de dragsters</h1>
  </div>
  <div class="h-3" style="background: repeating-conic-gradient(#fff 0% 25%, #10233B 0% 50%) 0 0 / 24px 24px"></div>
</header>

<main class="mx-auto max-w-3xl px-4 py-8">
  <p id="error" role="alert" class="mb-6 hidden rounded-md border-2 border-bandera bg-white px-4 py-3 font-semibold text-bandera"></p>

  <section id="config">
    <h2 class="text-2xl font-bold">Configurar la carrera</h2>
    <form id="form-config" class="mt-4 grid gap-4 sm:grid-cols-[1fr_9rem_auto] sm:items-end">
      <label class="block font-semibold">Nombre de la carrera
        <input id="c-nombre" class="campo" maxlength="100" required placeholder="Final de 3.º año">
      </label>
      <label class="block font-semibold">Cupo
        <input id="c-cupo" class="campo" type="number" min="2" max="50" required inputmode="numeric" placeholder="8">
      </label>
      <button class="boton">Crear carrera</button>
    </form>
  </section>

  <section id="registro" class="hidden">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 id="titulo" class="text-2xl font-bold"></h2>
      <p class="text-lg font-semibold"><span id="contador"></span> competidores</p>
    </div>

    <form id="form-comp" class="mt-4 grid gap-4 sm:grid-cols-[1fr_9rem_auto] sm:items-end">
      <label class="block font-semibold">Nombre
        <input id="k-nombre" class="campo" maxlength="80" required>
      </label>
      <label class="block font-semibold">Número
        <input id="k-numero" class="campo" type="number" min="1" max="9999" required inputmode="numeric">
      </label>
      <button class="boton">Agregar competidor</button>
    </form>

    <div id="largada" class="mt-4 flex flex-wrap items-center gap-4">
      <button id="largar" class="boton !bg-bandera px-8 text-2xl">Largar</button>
      <p id="faltan" class="font-semibold"></p>
    </div>

    <div id="cronometro" class="mt-6 hidden rounded-md bg-asfalto px-6 py-6 text-white">
      <p id="estado-carrera" class="font-semibold text-white/70">Carrera en curso</p>
      <p id="reloj" class="text-7xl tabular-nums sm:text-8xl" style="font-family: Impact, 'Arial Narrow Bold', sans-serif">00:00.00</p>
    </div>

    <div id="resultados" class="hidden">
      <div id="b-pista" class="mt-8"><h3 class="text-xl font-bold">En pista</h3><ul id="l-pista" class="mt-2 space-y-2"></ul></div>
      <div id="b-pos" class="mt-8"><h3 class="text-xl font-bold">Posiciones</h3><ul id="l-pos" class="mt-2 space-y-2"></ul></div>
      <div id="b-inc" class="mt-8"><h3 class="text-xl font-bold">Incidentes</h3><ul id="l-inc" class="mt-2 space-y-2"></ul></div>
    </div>

    <ul id="lista" class="mt-6 space-y-2"></ul>

    <button id="nueva" class="mt-8 font-semibold underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa">Empezar una carrera nueva</button>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let carreraId = null;
try { carreraId = Number(localStorage.getItem('carreraId')) || null; } catch (e) { /* sin almacenamiento */ }

async function api(metodo, url, cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json' },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.error || 'No se pudo completar la acción. Probá de nuevo.');
  return datos;
}

function mostrarError(msg) {
  $('error').textContent = msg || '';
  $('error').classList.toggle('hidden', !msg);
}

async function accion(fn) {
  mostrarError('');
  try { await fn(); } catch (e) { mostrarError(e.message); }
}

function fila(clases, hijos) {
  const li = document.createElement('li');
  li.className = 'flex items-center gap-4 rounded-md px-3 py-2 ' + clases;
  hijos.forEach((h) => li.appendChild(h));
  return li;
}

function dibujar(estado) {
  const { carrera, competidores, completa } = estado;
  $('config').classList.add('hidden');
  $('registro').classList.remove('hidden');
  $('titulo').textContent = carrera.nombre;
  $('contador').textContent = competidores.length + ' de ' + carrera.cupo;
  const enConfig = carrera.estado === 'configuracion';
  const faltan = carrera.cupo - competidores.length;
  $('form-comp').classList.toggle('hidden', !enConfig);
  Array.from($('form-comp').elements).forEach((el) => { el.disabled = completa; });
  $('largada').classList.toggle('hidden', !enConfig);
  $('lista').classList.toggle('hidden', !enConfig);
  $('largar').disabled = !completa;
  $('faltan').textContent = completa
    ? 'Lista completa. Ya se puede largar.'
    : 'Faltan ' + faltan + (faltan === 1 ? ' competidor' : ' competidores') + ' para poder largar.';
  $('cronometro').classList.toggle('hidden', enConfig);
  $('resultados').classList.toggle('hidden', enConfig);
  if (carrera.estado === 'en_curso') {
    $('estado-carrera').textContent = 'Carrera en curso';
    iniciarReloj(carrera.inicio_ms, estado.ahora_ms - Date.now());
  } else {
    detenerReloj();
    if (!enConfig) {
      // El circuito se detuvo: el reloj queda con el tiempo total de la carrera.
      $('estado-carrera').textContent = 'Carrera terminada';
      $('reloj').textContent = formato(carrera.fin_ms - carrera.inicio_ms);
    }
  }
  if (!enConfig) dibujarResultados(competidores);

  const lista = $('lista');
  lista.replaceChildren();
  for (let i = 0; i < carrera.cupo; i++) {
    const c = competidores[i];
    if (!c) {
      const libre = document.createElement('span');
      libre.className = 'text-asfalto/50';
      libre.textContent = 'Lugar libre';
      lista.appendChild(fila('h-[3.75rem] border-2 border-dashed border-asfalto/30', [libre]));
      continue;
    }
    const placa = document.createElement('span');
    placa.className = 'placa';
    placa.textContent = c.numero;
    const nombre = document.createElement('span');
    nombre.className = 'flex-1 text-xl font-semibold';
    nombre.textContent = c.nombre;
    const quitar = document.createElement('button');
    quitar.className = 'font-semibold text-bandera underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa';
    quitar.textContent = 'Quitar';
    quitar.setAttribute('aria-label', 'Quitar a ' + c.nombre);
    quitar.onclick = () => accion(async () => dibujar(await api('DELETE', '/api/carreras/' + carreraId + '/competidores/' + c.id)));
    lista.appendChild(fila('border-2 border-asfalto bg-white', [placa, nombre, quitar]));
  }
}

// Cronómetro: el tiempo sale del reloj del servidor, así sigue bien aunque se recargue la página.
let relojId = null;
function formato(ms) {
  const cent = Math.floor(ms / 10) % 100;
  const seg = Math.floor(ms / 1000) % 60;
  const min = Math.floor(ms / 60000);
  return String(min).padStart(2, '0') + ':' + String(seg).padStart(2, '0') + '.' + String(cent).padStart(2, '0');
}
function detenerReloj() {
  if (relojId) cancelAnimationFrame(relojId);
  relojId = null;
}
function iniciarReloj(inicio, desfase) {
  detenerReloj();
  const pintar = () => {
    $('reloj').textContent = formato(Math.max(0, Date.now() + desfase - inicio));
    relojId = requestAnimationFrame(pintar);
  };
  pintar();
}

// ---- Llegadas, incidentes y posiciones ----
const marcar = (id, tipo) => accion(async () =>
  dibujar(await api('POST', '/api/carreras/' + carreraId + '/competidores/' + id + '/' + tipo)));

function etiqueta(clases, texto) {
  const s = document.createElement('span');
  s.className = clases;
  s.textContent = texto;
  return s;
}

// alClick tiene que devolver una promesa; el botón queda deshabilitado mientras tanto (evita el doble clic).
function boton(texto, clases, alClick) {
  const b = document.createElement('button');
  b.className = clases;
  b.textContent = texto;
  b.onclick = () => { b.disabled = true; alClick().finally(() => { b.disabled = false; }); };
  return b;
}

function llenar(bloque, items, hacerFila) {
  $('b-' + bloque).classList.toggle('hidden', items.length === 0);
  const ul = $('l-' + bloque);
  ul.replaceChildren();
  items.forEach((c) => ul.appendChild(hacerFila(c)));
}

function dibujarResultados(competidores) {
  const placa = (c) => etiqueta('placa', c.numero);
  const nombre = (c) => etiqueta('flex-1 text-xl font-semibold', c.nombre);
  const enPista = competidores.filter((c) => c.estado === 'en_carrera');
  const llegaron = competidores.filter((c) => c.estado === 'llego').sort((a, b) => a.tiempo_ms - b.tiempo_ms);
  const incidentes = competidores.filter((c) => c.estado === 'incidente');
  const claseIncidente = 'rounded-md border-2 border-bandera px-4 py-2 text-lg font-bold text-bandera focus:outline-none focus:ring-4 focus:ring-placa disabled:opacity-40';

  llenar('pista', enPista, (c) => fila('border-2 border-asfalto bg-white', [
    placa(c), nombre(c),
    boton('Llegó', 'boton', () => marcar(c.id, 'llegada')),
    boton('Incidente', claseIncidente, () => marcar(c.id, 'incidente')),
  ]));

  llenar('pos', llegaron, (c) => fila('border-2 border-asfalto bg-white', [
    etiqueta('w-12 text-4xl font-black tabular-nums', c.posicion),
    placa(c), nombre(c),
    etiqueta('text-2xl font-bold tabular-nums', formato(c.tiempo_ms)),
    boton('Incidente', 'font-semibold text-bandera underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa', () => {
      if (!confirm('¿Marcar incidente a ' + c.nombre + '? Se borra su tiempo.')) return Promise.resolve();
      return marcar(c.id, 'incidente');
    }),
  ]));

  llenar('inc', incidentes, (c) => fila('border-2 border-bandera bg-white', [
    placa(c), nombre(c), etiqueta('font-bold text-bandera', 'Incidente'),
  ]));
}

$('largar').onclick = () => accion(async () => {
  $('largar').disabled = true; // evita el doble clic
  try {
    dibujar(await api('POST', '/api/carreras/' + carreraId + '/largada'));
  } catch (e) {
    dibujar(await api('GET', '/api/carreras/' + carreraId));
    throw e;
  }
});

function mostrarConfig() {
  detenerReloj();
  $('registro').classList.add('hidden');
  $('config').classList.remove('hidden');
  $('c-nombre').focus();
}

function guardarId(id) {
  carreraId = id;
  try { id ? localStorage.setItem('carreraId', id) : localStorage.removeItem('carreraId'); } catch (e) { /* sin almacenamiento */ }
}

$('form-config').onsubmit = (ev) => {
  ev.preventDefault();
  accion(async () => {
    const estado = await api('POST', '/api/carreras', { nombre: $('c-nombre').value, cupo: $('c-cupo').value });
    guardarId(estado.carrera.id);
    dibujar(estado);
    $('k-nombre').focus();
  });
};

$('form-comp').onsubmit = (ev) => {
  ev.preventDefault();
  accion(async () => {
    dibujar(await api('POST', '/api/carreras/' + carreraId + '/competidores', { nombre: $('k-nombre').value, numero: $('k-numero').value }));
    $('form-comp').reset();
    $('k-nombre').focus();
  });
};

$('nueva').onclick = () => {
  if (!confirm('¿Empezar una carrera nueva? Vas a dejar de trabajar con la carrera actual.')) return;
  mostrarError('');
  guardarId(null);
  $('form-config').reset();
  mostrarConfig();
};

if (carreraId) {
  api('GET', '/api/carreras/' + carreraId).then(dibujar).catch(() => guardarId(null));
}
</script>
</body>
</html>
