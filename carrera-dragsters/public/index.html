<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreras de dragsters</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    asfalto: '#10233B', hormigon: '#E6E8E5', bandera: '#C8242B', placa: '#F5C400'
  } } } };
</script>
<style>
  @media (min-width: 1280px) { html { font-size: 20px; } }
  /* Al imprimir o guardar como PDF quedan solo el encabezado, el podio y las tablas. */
  @media print {
    header, #config, #form-comp, #largada, #lista, #cronometro, #b-pista, #b-des, #error, #aviso, #nueva, .no-imprimir, button { display: none !important; }
    body { background: #fff; }
    main { max-width: none !important; padding: 0 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ganador { transform: none !important; box-shadow: none !important; }
    li, #podio > div { break-inside: avoid; }
  }
  .ganador { background: #F5C400 !important; border-width: 4px !important; transform: scale(1.03); box-shadow: 0 10px 25px rgba(16, 35, 59, 0.35); }
  .ganador .placa { background: #fff; }
  .ganador-anim { animation: zoom-ganador 0.9s ease-out; }
  @keyframes zoom-ganador { 0% { transform: scale(1); } 55% { transform: scale(1.09); } 100% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { .ganador-anim { animation: none; } }
</style>
<style type="text/tailwindcss">
  @layer components {
    .campo { @apply mt-1 block w-full rounded-md border-2 border-asfalto/30 bg-white px-3 py-2 text-lg text-asfalto focus:border-asfalto focus:outline-none focus:ring-4 focus:ring-placa disabled:bg-hormigon disabled:text-asfalto/40; }
    .boton { @apply rounded-md bg-asfalto px-5 py-2 text-lg font-bold text-white focus:outline-none focus:ring-4 focus:ring-placa disabled:cursor-not-allowed disabled:opacity-40; }
    .placa { @apply flex h-12 w-16 shrink-0 items-center justify-center rounded-md border-2 border-asfalto bg-placa text-3xl text-asfalto; font-family: Impact, 'Arial Narrow Bold', sans-serif; }
  }
</style>
</head>
<body class="min-h-screen bg-hormigon text-asfalto">
<header class="bg-asfalto text-white">
  <div class="mx-auto max-w-3xl px-4 py-6">
    <h1 class="text-4xl font-black italic tracking-tight" style="font-family: Impact, 'Arial Narrow Bold', sans-serif">Carreras de dragsters</h1>
    <a href="/proyector" target="_blank" rel="noopener" class="mt-2 inline-block font-semibold text-white/80 underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa">Abrir vista de proyector</a>
    <a href="/historial" class="ml-4 mt-2 inline-block font-semibold text-white/80 underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa">Historial de carreras</a>
    <button id="probar-sonido" type="button" class="ml-4 mt-2 inline-block font-semibold text-white/80 underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa">Probar sonido</button>
  </div>
  <div class="h-3" style="background: repeating-conic-gradient(#fff 0% 25%, #10233B 0% 50%) 0 0 / 24px 24px"></div>
</header>

<main class="mx-auto max-w-3xl px-4 py-8">
  <p id="error" role="alert" class="mb-6 hidden rounded-md border-2 border-bandera bg-white px-4 py-3 font-semibold text-bandera"></p>

  <p id="aviso" role="status" class="mb-6 hidden rounded-md bg-asfalto px-4 py-3 text-lg font-semibold text-white"></p>

  <section id="config">
    <h2 class="text-2xl font-bold">Configurar la carrera</h2>
    <form id="form-config" class="mt-4 grid gap-4 sm:grid-cols-[1fr_9rem_auto] sm:items-end">
      <label class="block font-semibold">Nombre de la carrera
        <input id="c-nombre" class="campo" maxlength="100" required placeholder="Final de 3.º año">
      </label>
      <label class="block font-semibold">Cupo
        <input id="c-cupo" class="campo" type="number" min="2" max="50" required inputmode="numeric" placeholder="8">
      </label>
      <button class="boton">Crear carrera</button>
    </form>
  </section>

  <section id="registro" class="hidden">
    <div class="no-imprimir flex flex-wrap items-end justify-between gap-3">
      <h2 id="titulo" class="text-2xl font-bold"></h2>
      <p class="text-lg font-semibold"><span id="contador"></span> competidores</p>
    </div>

    <form id="form-comp" class="mt-4 grid gap-4 sm:grid-cols-[1fr_9rem_auto] sm:items-end">
      <label class="block font-semibold">Nombre
        <input id="k-nombre" class="campo" maxlength="80" required>
      </label>
      <label class="block font-semibold">Número
        <input id="k-numero" class="campo" type="number" min="1" max="9999" required inputmode="numeric">
      </label>
      <button class="boton">Agregar competidor</button>
    </form>

    <div id="largada" class="mt-4 flex flex-wrap items-center gap-4">
      <button id="largar" class="boton !bg-bandera px-8 text-2xl">Largar</button>
      <p id="faltan" class="font-semibold"></p>
    </div>

    <div id="cronometro" class="mt-6 hidden rounded-md bg-asfalto px-6 py-6 text-white">
      <p id="estado-carrera" class="font-semibold text-white/70">Carrera en curso</p>
      <p id="reloj" class="text-7xl tabular-nums sm:text-8xl lg:text-9xl" style="font-family: Impact, 'Arial Narrow Bold', sans-serif">00:00.00</p>
    </div>

    <div id="resultados" class="hidden">
      <div id="encabezado-impresion" class="hidden print:block">
        <h1 id="imp-titulo" class="text-3xl font-black"></h1>
        <p id="imp-detalle" class="mt-1 text-lg"></p>
      </div>
      <div id="b-podio" class="mt-8 hidden">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <h3 class="text-xl font-bold">Podio</h3>
          <button id="imprimir" class="boton no-imprimir">Imprimir o guardar como PDF</button>
        </div>
        <div id="podio" class="mt-4 flex items-end gap-3"></div>
        <p class="no-imprimir mt-2">En la ventana que se abre, elegí "Guardar como PDF" como impresora para guardar el archivo.</p>
      </div>
      <div id="b-des" class="mt-8 hidden rounded-md border-2 border-bandera bg-white p-4">
        <h3 id="des-titulo" class="text-xl font-bold"></h3>
        <p id="des-texto" class="mt-1"></p>
        <button id="des-largar" class="boton !bg-bandera mt-3 hidden">Largar desempate</button>
        <ul id="l-des" class="mt-3 space-y-2"></ul>
      </div>
      <div class="lg:grid lg:grid-cols-2 lg:gap-x-8">
      <div id="b-pista" class="mt-8 lg:col-start-1 lg:row-start-1"><h3 class="text-xl font-bold">En pista</h3><ul id="l-pista" class="mt-2 space-y-2"></ul></div>
      <div id="b-pos" class="mt-8 lg:col-start-2 lg:row-start-1 lg:row-span-2"><h3 class="text-xl font-bold">Posiciones</h3><ul id="l-pos" class="mt-2 space-y-2"></ul></div>
      <div id="b-inc" class="mt-8 lg:col-start-1 lg:row-start-2"><h3 class="text-xl font-bold">Incidentes</h3><ul id="l-inc" class="mt-2 space-y-2"></ul></div>
      </div>
    </div>

    <ul id="lista" class="mt-6 space-y-2"></ul>

    <button id="nueva" class="mt-8 font-semibold underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa">Empezar una carrera nueva</button>
  </section>
</main>

<script src="/sonido.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let carreraId = null;
try { carreraId = Number(localStorage.getItem('carreraId')) || null; } catch (e) { /* sin almacenamiento */ }

async function api(metodo, url, cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json' },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.error || 'No se pudo completar la acción. Probá de nuevo.');
  return datos;
}

function mostrarError(msg) {
  $('error').textContent = msg || '';
  $('error').classList.toggle('hidden', !msg);
}

function mostrarAviso(msg) {
  $('aviso').textContent = msg || '';
  $('aviso').classList.toggle('hidden', !msg);
}

async function accion(fn) {
  mostrarError('');
  mostrarAviso('');
  try { await fn(); } catch (e) { mostrarError(e.message); }
}

function fila(clases, hijos) {
  const li = document.createElement('li');
  li.className = 'flex items-center gap-4 rounded-md px-3 py-2 ' + clases;
  hijos.forEach((h) => li.appendChild(h));
  return li;
}

function dibujar(estado) {
  const { carrera, competidores, completa } = estado;
  $('config').classList.add('hidden');
  $('registro').classList.remove('hidden');
  $('titulo').textContent = carrera.nombre;
  $('contador').textContent = competidores.length + ' de ' + carrera.cupo;
  if (estado.repetida) {
    mostrarAviso('Todos tuvieron un incidente: la carrera se repite con los mismos participantes. Cuando estén listos, apretá Largar.');
  }
  const enConfig = carrera.estado === 'configuracion';
  const faltan = carrera.cupo - competidores.length;
  $('form-comp').classList.toggle('hidden', !enConfig);
  Array.from($('form-comp').elements).forEach((el) => { el.disabled = completa; });
  $('largada').classList.toggle('hidden', !enConfig);
  $('lista').classList.toggle('hidden', !enConfig);
  $('largar').disabled = !completa;
  $('faltan').textContent = completa
    ? 'Lista completa. Ya se puede largar.'
    : 'Faltan ' + faltan + (faltan === 1 ? ' competidor' : ' competidores') + ' para poder largar.';
  document.querySelector('main').classList.toggle('max-w-3xl', enConfig);
  document.querySelector('main').classList.toggle('max-w-6xl', !enConfig);
  $('cronometro').classList.toggle('hidden', enConfig);
  $('resultados').classList.toggle('hidden', enConfig);
  if (carrera.estado === 'en_curso') {
    iniciarReloj(carrera.inicio_ms, estado.ahora_ms - Date.now(), 'Carrera en curso', true);
  } else if (estado.desempate.estado === 'en_curso') {
    // Durante el desempate el reloj cuenta el desempate.
    const des = estado.desempate;
    iniciarReloj(des.inicio_ms, estado.ahora_ms - Date.now(),
      'Desempate por el ' + des.posicion + '.º puesto, intento ' + des.ronda + ' de ' + des.maximo, true);
  } else {
    detenerReloj();
    if (!enConfig) {
      // El circuito se detuvo: el reloj queda con el tiempo total de la carrera.
      $('estado-carrera').textContent = estado.desempate.estado ? 'Carrera terminada: hay un empate' : 'Carrera terminada';
      $('reloj').textContent = formato(carrera.fin_ms - carrera.inicio_ms);
    }
  }
  if (!enConfig) dibujarResultados(estado);

  const lista = $('lista');
  lista.replaceChildren();
  for (let i = 0; i < carrera.cupo; i++) {
    const c = competidores[i];
    if (!c) {
      const libre = document.createElement('span');
      libre.className = 'text-asfalto/50';
      libre.textContent = 'Lugar libre';
      lista.appendChild(fila('h-[3.75rem] border-2 border-dashed border-asfalto/30', [libre]));
      continue;
    }
    const placa = document.createElement('span');
    placa.className = 'placa';
    placa.textContent = c.numero;
    const nombre = document.createElement('span');
    nombre.className = 'flex-1 text-xl font-semibold';
    nombre.textContent = c.nombre;
    const quitar = document.createElement('button');
    quitar.className = 'font-semibold text-bandera underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa';
    quitar.textContent = 'Quitar';
    quitar.setAttribute('aria-label', 'Quitar a ' + c.nombre);
    quitar.onclick = () => accion(async () => dibujar(await api('DELETE', '/api/carreras/' + carreraId + '/competidores/' + c.id)));
    lista.appendChild(fila('border-2 border-asfalto bg-white', [placa, nombre, quitar]));
  }
}

// Cronómetro: el tiempo sale del reloj del servidor, así sigue bien aunque se recargue la página.
let relojId = null;
let pistaBloqueada = false; // los botones de En pista se deshabilitan durante la cuenta regresiva
function formato(ms) {
  const cent = Math.floor(ms / 10) % 100;
  const seg = Math.floor(ms / 1000) % 60;
  const min = Math.floor(ms / 60000);
  return String(min).padStart(2, '0') + ':' + String(seg).padStart(2, '0') + '.' + String(cent).padStart(2, '0');
}
function detenerReloj() {
  if (relojId) cancelAnimationFrame(relojId);
  relojId = null;
  pistaBloqueada = false;
}

// Deshabilita (o habilita) Llegó e Incidente de En pista y del desempate.
function bloquearPista(si) {
  if (!si && !pistaBloqueada) return;
  pistaBloqueada = si;
  document.querySelectorAll('#l-pista button, #l-des button').forEach((b) => { b.disabled = si; });
}
// Con cuenta regresiva (carrera principal): antes de la hora de largada muestra 3, 2, 1 y deshabilita los botones;
// en el "ya" muestra ¡YA! un instante y desde ahí cuenta el tiempo. La hora sale del servidor, así que recargar la página no la pierde.
function iniciarReloj(inicio, desfase, etiqueta, conCuenta) {
  detenerReloj();
  const pintar = () => {
    const ms = Date.now() + desfase - inicio;
    if (conCuenta) Sonido.programar(inicio, desfase); // pitido en el 3, 2, 1 y en el ya
    if (conCuenta && ms < 0) {
      $('reloj').textContent = String(Math.ceil(-ms / 1000));
      $('estado-carrera').textContent = 'Preparados...';
    } else {
      $('reloj').textContent = conCuenta && ms < 700 ? '¡YA!' : formato(Math.max(0, ms));
      if (conCuenta) $('estado-carrera').textContent = etiqueta;
    }
    if (conCuenta) bloquearPista(ms < 0);
    relojId = requestAnimationFrame(pintar);
  };
  pintar();
}

// ---- Llegadas, incidentes y posiciones ----
const marcar = (id, tipo) => accion(async () =>
  dibujar(await api('POST', '/api/carreras/' + carreraId + '/competidores/' + id + '/' + tipo)));

function etiqueta(clases, texto) {
  const s = document.createElement('span');
  s.className = clases;
  s.textContent = texto;
  return s;
}

// alClick tiene que devolver una promesa; el botón queda deshabilitado mientras tanto (evita el doble clic).
function boton(texto, clases, alClick) {
  const b = document.createElement('button');
  b.className = clases;
  b.textContent = texto;
  b.onclick = () => { b.disabled = true; alClick().finally(() => { b.disabled = false; }); };
  return b;
}

function llenar(bloque, items, hacerFila) {
  $('b-' + bloque).classList.toggle('hidden', items.length === 0);
  const ul = $('l-' + bloque);
  ul.replaceChildren();
  items.forEach((c) => ul.appendChild(hacerFila(c)));
}

const marcarDes = (id, tipo) => accion(async () =>
  dibujar(await api('POST', '/api/carreras/' + carreraId + '/desempate/' + id + '/' + tipo)));

function dibujarDesempate(estado) {
  const des = estado.desempate;
  $('b-des').classList.toggle('hidden', !des.estado);
  if (!des.estado) return;
  $('des-titulo').textContent = 'Empate por el ' + des.posicion + '.º puesto: desempate ' + des.ronda + ' de ' + des.maximo;
  $('des-texto').textContent = des.estado === 'iniciar'
    ? 'Corren de nuevo solo los empatados. Cuando estén listos, largá el desempate.'
    : 'Desempate en curso: marcá la llegada de cada uno.';
  $('des-largar').classList.toggle('hidden', des.estado !== 'iniciar');
  $('des-largar').disabled = false;
  const ul = $('l-des');
  ul.replaceChildren();
  des.participantes.forEach((c) => {
    const acciones = des.estado === 'en_curso' && c.estado === 'en_carrera'
      ? [
        boton('Llegó', 'boton', () => marcarDes(c.id, 'llegada')),
        boton('Incidente', 'rounded-md border-2 border-bandera px-4 py-2 text-lg font-bold text-bandera focus:outline-none focus:ring-4 focus:ring-placa disabled:opacity-40', () => marcarDes(c.id, 'incidente')),
      ]
      : [etiqueta('text-2xl font-bold tabular-nums', c.estado === 'llego' ? formato(c.tiempo_ms) : c.estado === 'incidente' ? 'Incidente' : '')];
    ul.appendChild(fila('border-2 border-asfalto bg-white',
      [etiqueta('placa', c.numero), etiqueta('flex-1 text-xl font-semibold', c.nombre)].concat(acciones)));
  });
}

$('des-largar').onclick = () => accion(async () => {
  $('des-largar').disabled = true; // evita el doble clic
  try {
    dibujar(await api('POST', '/api/carreras/' + carreraId + '/desempate/iniciar'));
  } catch (e) {
    dibujar(await api('GET', '/api/carreras/' + carreraId));
    throw e;
  }
});

// ---- Podio: aparece con la carrera terminada y el ganador definido (sin desempate pendiente) ----
$('imprimir').onclick = () => window.print();

function dibujarPodio(estado) {
  const c = estado.carrera;
  const visible = c.estado === 'finalizada' && !estado.desempate.estado && estado.ganadores.length > 0;
  $('b-podio').classList.toggle('hidden', !visible);
  if (!visible) return;
  // Encabezado que solo se ve al imprimir
  const nombres = estado.competidores.filter((x) => estado.ganadores.includes(x.id)).map((x) => x.nombre).join(' y ');
  $('imp-titulo').textContent = c.nombre + ': resultados finales';
  $('imp-detalle').textContent = 'Fecha: ' + new Date(c.fin_ms).toLocaleString('es-AR') + '. Tiempo total: ' + formato(c.fin_ms - c.inicio_ms) +
    '. ' + (estado.ganadores.length > 1 ? 'Empate en el 1.er puesto: ' : 'Ganador: ') + nombres + '.';
  // Podio: 2.º a la izquierda, 1.º al centro, 3.º a la derecha (si hay empates, varios en el mismo escalón)
  const top = estado.competidores.filter((x) => x.estado === 'llego' && !x.eliminado && x.posicion <= 3);
  const altura = { 1: 'h-28', 2: 'h-20', 3: 'h-12' };
  const podio = $('podio');
  podio.replaceChildren();
  [2, 1, 3].forEach((p) => {
    const del = top.filter((x) => x.posicion === p).sort((a, b) => a.numero - b.numero);
    if (!del.length) return;
    const col = document.createElement('div');
    col.className = 'flex flex-1 flex-col justify-end gap-2';
    del.forEach((x) => {
      const ficha = document.createElement('div');
      ficha.className = 'flex flex-col items-center gap-1 rounded-md border-2 border-asfalto bg-white px-2 py-3 text-center' + (p === 1 ? ' ganador' : '');
      ficha.appendChild(etiqueta('placa', x.numero));
      ficha.appendChild(etiqueta('text-xl font-semibold', x.nombre));
      ficha.appendChild(etiqueta('text-lg font-bold tabular-nums', formato(x.tiempo_ms)));
      col.appendChild(ficha);
    });
    col.appendChild(etiqueta('flex items-center justify-center rounded-t-md text-4xl font-black ' + altura[p] + (p === 1 ? ' bg-placa text-asfalto' : ' bg-asfalto text-white'), p + '.º'));
    podio.appendChild(col);
  });
}

let ganadorVisto = null;

function dibujarResultados(estado) {
  const competidores = estado.competidores.filter((c) => !c.eliminado);
  const bloqueado = estado.hay_desempates || estado.desempate.estado; // ya no se editan incidentes de la carrera
  const placa = (c) => etiqueta('placa', c.numero);
  const nombre = (c) => etiqueta('flex-1 text-xl font-semibold', c.nombre);
  const enPista = competidores.filter((c) => c.estado === 'en_carrera');
  const llegaron = competidores.filter((c) => c.estado === 'llego')
    .sort((a, b) => a.posicion - b.posicion || a.tiempo_ms - b.tiempo_ms || a.numero - b.numero);
  const incidentes = competidores.filter((c) => c.estado === 'incidente');
  const claseIncidente = 'rounded-md border-2 border-bandera px-4 py-2 text-lg font-bold text-bandera focus:outline-none focus:ring-4 focus:ring-placa disabled:opacity-40';

  llenar('pista', enPista, (c) => fila('border-2 border-asfalto bg-white', [
    placa(c), nombre(c),
    boton('Llegó', 'boton', () => marcar(c.id, 'llegada')),
    boton('Incidente', claseIncidente, () => marcar(c.id, 'incidente')),
  ]));

  const hayGanador = estado.ganadores.length > 0;
  const puedeEliminar = estado.carrera.estado === 'finalizada' && !estado.desempate.estado;
  const eliminar = (c) => boton('Eliminar', 'font-semibold underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa', () => {
    if (!confirm('¿Sacar a ' + c.nombre + ' de la tabla final? No se puede deshacer.')) return Promise.resolve();
    return marcar(c.id, 'eliminar');
  });
  const deshacer = (c) => boton('Deshacer', 'font-semibold underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa', () => {
    const que = c.estado === 'llego' ? 'Se borra su tiempo de llegada.' : 'Se quita su incidente.';
    const reabre = estado.carrera.estado === 'finalizada' ? ' La carrera se reabre y el reloj sigue corriendo.' : '';
    if (!confirm('¿Devolver a ' + c.nombre + ' a la pista? ' + que + reabre)) return Promise.resolve();
    return marcar(c.id, 'deshacer');
  });
  // El zoom sobre el ganador se anima una sola vez; después queda resaltado fijo.
  const clave = carreraId + ':' + estado.ganadores.join(',');
  const animar = hayGanador && clave !== ganadorVisto;
  if (hayGanador) ganadorVisto = clave;

  llenar('pos', llegaron, (c) => {
    const gana = estado.ganadores.includes(c.id);
    const clases = 'border-2 border-asfalto bg-white' +
      (gana ? ' ganador' + (animar ? ' ganador-anim' : '') : hayGanador ? ' opacity-70' : '');
    const partes = [
      etiqueta('w-12 text-4xl font-black tabular-nums', c.posicion),
      placa(c), nombre(c),
      etiqueta('text-2xl font-bold tabular-nums', formato(c.tiempo_ms)),
    ];
    if (gana) {
      partes.push(etiqueta('rounded-md bg-asfalto px-3 py-1 font-bold text-white',
        estado.ganadores.length > 1 ? 'Empate en 1.º' : 'Ganador'));
    }
    if (!bloqueado) {
      partes.push(boton('Incidente', 'font-semibold text-bandera underline underline-offset-4 focus:outline-none focus:ring-4 focus:ring-placa', () => {
        if (!confirm('¿Marcar incidente a ' + c.nombre + '? Se borra su tiempo.')) return Promise.resolve();
        return marcar(c.id, 'incidente');
      }));
    }
    if (!estado.hay_desempates) partes.push(deshacer(c));
    if (puedeEliminar && !gana) partes.push(eliminar(c));
    return fila(clases, partes);
  });

  dibujarDesempate(estado);
  dibujarPodio(estado);

  llenar('inc', incidentes, (c) => fila('border-2 border-bandera bg-white', [
    placa(c), nombre(c), etiqueta('font-bold text-bandera', 'Incidente'),
  ].concat(estado.hay_desempates ? [] : [deshacer(c)]).concat(puedeEliminar ? [eliminar(c)] : [])));
}

// Habilita el audio (los navegadores lo exigen) y hace sonar un pitido de prueba para ajustar el volumen.
$('probar-sonido').onclick = () => {
  mostrarError('');
  Sonido.desbloquear().then(() => {
    if (Sonido.listo()) Sonido.probar();
    else mostrarError('Este navegador no dejó activar el sonido. Probá tocando la ventana y apretando de nuevo.');
  });
};

$('largar').onclick = () => accion(async () => {
  $('largar').disabled = true; // evita el doble clic
  try {
    dibujar(await api('POST', '/api/carreras/' + carreraId + '/largada'));
  } catch (e) {
    dibujar(await api('GET', '/api/carreras/' + carreraId));
    throw e;
  }
});

function mostrarConfig() {
  detenerReloj();
  $('registro').classList.add('hidden');
  $('config').classList.remove('hidden');
  $('c-nombre').focus();
}

function guardarId(id) {
  carreraId = id;
  try { id ? localStorage.setItem('carreraId', id) : localStorage.removeItem('carreraId'); } catch (e) { /* sin almacenamiento */ }
}

$('form-config').onsubmit = (ev) => {
  ev.preventDefault();
  accion(async () => {
    const estado = await api('POST', '/api/carreras', { nombre: $('c-nombre').value, cupo: $('c-cupo').value });
    guardarId(estado.carrera.id);
    dibujar(estado);
    $('k-nombre').focus();
  });
};

$('form-comp').onsubmit = (ev) => {
  ev.preventDefault();
  accion(async () => {
    dibujar(await api('POST', '/api/carreras/' + carreraId + '/competidores', { nombre: $('k-nombre').value, numero: $('k-numero').value }));
    $('form-comp').reset();
    $('k-nombre').focus();
  });
};

$('nueva').onclick = () => {
  if (!confirm('¿Empezar una carrera nueva? Vas a dejar de trabajar con la carrera actual.')) return;
  mostrarError('');
  guardarId(null);
  $('form-config').reset();
  mostrarConfig();
};

if (carreraId) {
  api('GET', '/api/carreras/' + carreraId).then(dibujar).catch(() => guardarId(null));
}
</script>
</body>
</html>
